# Generated by `brew tap-new` and adapted for this tap:
#   - primary macOS leg pinned to macos-15 (Tier 1 Apple Silicon) instead of
#     the tap-new default macos-26, per this tap's bottle-support target.
#   - added an ubuntu-24.04-arm leg. GitHub's ubuntu-24.04-arm hosted runner
#     is GA (no self-hosted arm64 runner needed), and ghcr.io/homebrew/brew:main
#     is a multi-arch image (verified via `docker manifest inspect`: it carries
#     both linux/amd64 and linux/arm64 manifests), so the same container
#     reference used for the x86_64 leg resolves to the arm64 image here
#     automatically — no separate image tag or registry config required.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      # `brew doctor` (invoked by `--only-setup`) warns about untrusted
      # third-party taps (Homebrew/brew#22470). Under HOMEBREW_DEVELOPER,
      # which test-bot sets, that warning is fatal. Trusting this tap covers
      # every formula in it, present and future.
      - run: brew trust --tap jrschumacher/deepgram

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
